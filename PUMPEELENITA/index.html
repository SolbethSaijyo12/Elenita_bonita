<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Mi Amor💜</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #9d4edd, #3a0a6a);
        font-family: 'Segoe UI', sans-serif;
    }

    /* Partículas */
    .particles span {
        position: absolute;
        bottom: -10px;
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: rise 8s infinite ease-in;
        opacity: 0.6;
    }

    @keyframes rise {
        0% {
            transform: translateY(0) scale(0.5);
            opacity: 0;
        }
        50% {
            opacity: 1;
        }
        100% {
            transform: translateY(-120vh) scale(1.2);
            opacity: 0;
        }
    }

    /* Tarjeta */
    .card {
        width: 90%;
        max-width: 360px;
        height: 520px;
        background: rgba(255,255,255,0.15);
        border-radius: 25px;
        box-shadow: 0 0 40px rgba(0,0,0,0.4);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        cursor: pointer;
        padding: 20px;
        transition: transform 0.4s ease;
        z-index: 2;
    }

    .card:active {
        transform: scale(0.97);
    }

    .front {
        color: #fff;
        font-size: 24px;
        line-height: 1.4;
    }

    .front span {
        font-size: 40px;
        display: block;
        margin-bottom: 10px;
        animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    .content {
        display: none;
        flex-direction: column;
        align-items: center;
        color: #fff;
    }

    .content img {
        width: 220px;
        max-width: 100%;
        border-radius: 20px;
        margin-bottom: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        animation: fadeIn 1.2s ease;
    }

    .message {
        font-size: 18px;
        line-height: 1.5;
        animation: fadeIn 1.6s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Corazones flotantes */
    .heart {
        position: absolute;
        font-size: 18px;
        color: #ffb3ff;
        animation: floatUp 6s infinite ease-in;
        opacity: 0.7;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(0.8);
            opacity: 0;
        }
        50% {
            opacity: 1;
        }
        100% {
            transform: translateY(-100vh) scale(1.3);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<!-- Partículas -->
<div class="particles">
    <span style="left:10%; animation-delay:0s;"></span>
    <span style="left:25%; animation-delay:2s;"></span>
    <span style="left:40%; animation-delay:4s;"></span>
    <span style="left:55%; animation-delay:1s;"></span>
    <span style="left:70%; animation-delay:3s;"></span>
    <span style="left:85%; animation-delay:5s;"></span>
</div>

<!-- Corazones -->
<div class="heart" style="left:15%; animation-delay:0s;">💜</div>
<div class="heart" style="left:35%; animation-delay:2s;">💜</div>
<div class="heart" style="left:55%; animation-delay:4s;">💜</div>
<div class="heart" style="left:75%; animation-delay:1s;">💜</div>

<!-- Tarjeta -->
<div class="card" onclick="openCard()">
    <div class="front" id="front">
        <span>💜</span>
        Toca la tarjeta<br>
        tengo algo especial para ti ✨
    </div>

    <div class="content" id="content">
        <img src="sorpresa.jpeg" alt="Imagen especial">
        <div class="message">
            🎂 Feliz Cumpleaños 🎂<br>
            Que tu vida esté llena de amor, magia,<br>
            sonrisas y momentos hermosos, te amo. 💜✨ <br>
            con mucho amor, Elizabeth. 💜
        </div>
    </div>
</div>

<audio id="music" src="musica.mp3"></audio>

<script>
function openCard() {
    document.getElementById("front").style.display = "none";
    document.getElementById("content").style.display = "flex";
    document.getElementById("music").play();
}
</script>

</body>
</html>
